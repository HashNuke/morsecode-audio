name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o /tmp/morse-smoke ./cmd/smoke
      - run: docker build -t morsecode-audio:ci .
      - name: Verify read-only image and injected port
        run: |
          docker run -d --name morse-audio-ci --read-only --memory=512m --cpus=2 \
            -e PORT=9876 -e GOMEMLIMIT=256MiB -p 127.0.0.1:8787:9876 morsecode-audio:ci
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8787/readyz
          /tmp/morse-smoke -base-url http://127.0.0.1:8787
          docker stop --timeout 10 morse-audio-ci
          test "$(docker inspect --format '{{.State.ExitCode}}' morse-audio-ci)" = 0
      - if: always()
        run: docker rm -f morse-audio-ci || true
